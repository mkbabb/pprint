[package]
name = "pprint"
version = "0.5.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Flexible and lightweight pretty printing library for Rust"
repository = "https://github.com/mkbabb/pprint"
readme = "../README.md"
keywords = ["pretty", "printing", "rust"]
categories = ["text-processing", "development-tools"]

[lib]
name = "pprint"
path = "src/lib.rs"

[features]
default = []
regex = ["dep:regex"]

[dependencies]
ryu = "1.0"
itoap = "1.0.1"
pprint_derive = { path = "./derive", version = "0.3.0" }
regex = { version = "1.11", optional = true }

[dev-dependencies]
rand = "0.8"
pretty = "0.12"
divan = "0.1"

[[bench]]
name = "pprint"
path = "benches/pprint.rs"
harness = false

[[bench]]
name = "digit_count"
path = "benches/digit_count.rs"
harness = false

[profile.bench]
# opt-level = 0
