[package]
name = "pprint"
version = "0.3.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Flexible and lightweight pretty printing library for Rust"
repository = "https://github.com/mkbabb/pprint"
readme = "../README.md"
keywords = ["pretty", "printing", "rust"]
categories = ["text-processing", "development-tools"]

[lib]
name = "pprint"
path = "src/lib.rs"

[features]
default = []
regex = ["dep:regex"]
ser = ["dep:bbnf-ser"]

[dependencies]
ryu = "1.0"
itoap = "1.0.1"
pprint_derive = { path = "./derive", version = "0.2.2" }
bbnf-ser = { version = "0.1", optional = true }
regex = { version = "1.11", optional = true }

[dev-dependencies]
rand = "0.8"
pretty = "0.12"

[profile.bench]
# opt-level = 0
