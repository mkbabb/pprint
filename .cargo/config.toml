# .cargo/config.toml — pprint sibling repo
#
# Minimal mirror of bbnf-lang's toolchain posture for cross-repo
# path-patched builds. Source of truth for pin is bbnf-lang's
# rust-toolchain.toml (mirrored here per B1.W2.c propagation).

[build]
rustflags = ["-Zthreads=8", "-Zshare-generics=y"]

[target.aarch64-apple-darwin]
rustflags = ["-Zthreads=8", "-Zshare-generics=y"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-Zthreads=8",
    "-Zshare-generics=y",
]

[profile.ax-iter]
inherits      = "dev"
opt-level     = 0
debug         = "line-tables-only"
incremental   = true
codegen-units = 256

[alias]
iter-check = "check --profile ax-iter"
iter-test  = "nextest run --cargo-profile ax-iter"

# ── Patches (CB-1a, sk-v27 LW1.COMP-4 extended to this repo at the LW1 lockstep gate) ──
# The optional `ser` feature depends on bbnf-ser, which lives in bbnf-lang and
# is not on crates.io until the pprint-ser move (PP-07) and the LW6 publish.
# It enters as a git + rev edge pinned to bbnf-lang origin/master, so a clean
# clone resolves with no sibling checkout and no path that leaves the
# repository (this replaces the untracked rust/.cargo/config.toml path patch).
[patch.crates-io]
bbnf-ser = { git = "https://github.com/mkbabb/bbnf-lang", rev = "c9b93adb4e4c2ec793af881f390f997cd4e11696" }
