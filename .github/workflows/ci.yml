name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# sk-v27 LW2.TOPO-3: the arm set is macos-15 (for the order's macos-14) and ubuntu-latest on the pinned
# stable toolchain (rust-toolchain.toml), a `cargo +stable` job on the latest
# stable, and an Intel SDE job that runs the suite as AVX-512 code. `ci-ok`
# needs every job and is the one required check. The build wrapper is set
# here, never in .cargo/config.toml (LW2.TOPO-2).

jobs:
  rust:
    name: Rust (${{ matrix.os }}) — clippy + nextest
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (Apple silicon, NEON): GitHub no longer serves macos-14
        # ("The configuration 'macos-14-arm64-us-default' is not supported",
        # pprint run 42732073134); the order's macos-14 arm reads here.
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: clippy -D warnings (all targets)
        run: cargo clippy --profile ax-iter --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: tests (nextest)
        run: cargo nextest run --cargo-profile ax-iter --workspace --no-fail-fast
        working-directory: rust
      - name: doctests
        run: cargo test --profile ax-iter --workspace --doc
        working-directory: rust

  stable:
    # The LW1.PERF-2 command on the latest stable release: the forward arm of
    # the pin, so a new stable that breaks the build is read before the pin
    # moves.
    name: Rust — cargo +stable (latest)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo +stable --version
      - run: cargo +stable build --release --locked
        working-directory: rust
      - run: cargo +stable test --workspace --locked --no-fail-fast
        working-directory: rust

  sde:
    # Intel SDE (Sapphire Rapids) executes the suite compiled for that CPU,
    # so every AVX-512 instruction the compiler emits runs on an emulated
    # part that has the ISA (ruling X-4: an x86 tier is executed in CI).
    name: Rust — Intel SDE (AVX-512, sapphirerapids)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=sapphirerapids
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin)
        run: |
          rustup toolchain install
          rustc --version
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      # `--target` keeps RUSTFLAGS off build scripts and proc macros, which
      # run natively on the runner; every test binary runs under SDE.
      - name: tests under SDE
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -spr --"
          cargo test --target x86_64-unknown-linux-gnu --workspace --locked --no-fail-fast --lib --tests
        working-directory: rust

  hermetic:
    # sk-v27 LW2.TOPO-1: a fresh checkout, with no sibling repositories and no
    # credentials, resolves and builds the crate from its pinned edges, and
    # the three-repository crate graph is a DAG (ruling X-5): pprint is the
    # leaf and takes no edge into parse-that or bbnf-lang.
    name: Rust — repo DAG + hermetic clean-clone build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (the rust-toolchain.toml pin)
        run: |
          rustup toolchain install
          rustc --version
      - name: repo DAG (pprint <- parse-that <- bbnf-lang)
        run: sh scripts/check-repo-dag.sh
      - name: hermetic build
        run: sh scripts/check-hermetic-build.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, stable, sde, hermetic]
    runs-on: ubuntu-latest
    steps:
      - name: every arm succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
